<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>प्रोफाइल — किसान मित्र</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <button class="mobile-toggle" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>
  <div class="sidebar">
    <div class="brand">
      <h1>किसान मित्र</h1>
     <div class="sub">उत्तर प्रदेश</div>
    </div>
    <div class="user-chip">
      <div class="name" id="user-name-display">—</div>
      <div class="logout" onclick="doLogout()">लॉगआउट</div>
    </div>
    <ul class="navlist">
      <li><a class="navitem" href="dashboard.html">डैशबोर्ड</a></li>
      <li><a class="navitem" href="mandi.html">मंडी भाव</a></li>
      <li><a class="navitem" href="weather.html">मौसम</a></li>
      <li><a class="navitem" href="disease.html">रोग पहचान</a></li>
      <li><a class="navitem" href="finance.html">खर्च-कमाई</a></li>
      <li><a class="navitem" href="crop.html">फसल सुझाव</a></li>
      <li><a class="navitem active" href="profile.html">मेरी प्रोफाइल</a></li>
      <li id="admin-nav-link" style="display:none;"><a class="navitem" href="admin.html">⚙ एडमिन पैनल</a></li>
    </ul>
    <div class="sidebar-foot">बैकएंड से जुड़ा है<br>http://localhost:5000</div>
  </div>

  <div class="main">
    <div class="topbar">
      <div>
        <h2>मेरी प्रोफाइल</h2>
        <div class="page-sub">अपना खाता देखें और बदलें</div>
      </div>
    </div>

    <div class="content">
      <div class="col2 card">
        <h3>खाता विवरण</h3>
        <div id="profile-status" class="empty">लोड हो रहा है...</div>
        <div id="profile-form" style="display:none;">
          <label>पूरा नाम</label>
          <input type="text" id="profile-name">
          <label>फ़ोन नंबर</label>
          <input type="text" id="profile-phone" disabled style="opacity:0.6;">
          <label>जिला</label>
          <select id="profile-district"></select>
          <label>ब्लॉक</label>
          <select id="profile-block" disabled></select>
          <button class="btn-primary" onclick="saveProfile()">बदलाव सहेजें</button>
          <div id="profile-msg" style="font-size:12px;margin-top:10px;"></div>
        </div>
      </div>

      <div class="col2 card">
        <h3>पासवर्ड बदलें</h3>
        <label>वर्तमान पासवर्ड</label>
        <input type="password" id="current-password">
        <label>नया पासवर्ड</label>
        <input type="password" id="new-password">
        <button class="btn-primary" onclick="savePassword()">पासवर्ड अपडेट करें</button>
        <div id="password-msg" style="font-size:12px;margin-top:10px;"></div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/profile.js"></script>
  <script>
    requireAuth();
    loadProfile();
    const currentUser = getUser();
    if (currentUser && currentUser.role === 'admin') {
      document.getElementById('admin-nav-link').style.display = 'block';
    }
  </script>
</body>

</html>
