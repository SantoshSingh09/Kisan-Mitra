<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>लॉगिन — किसान मित्र</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-page">
  <div>
    <div class="auth-box">
      <h1>लॉगिन</h1>
      <div class="sub">किसान मित्र में वापस स्वागत है</div>
      <div class="auth-error" id="auth-error"></div>

      <label>फ़ोन नंबर</label>
      <input type="tel" id="login-phone" placeholder="9876543210">
      <label>पासवर्ड</label>
      <input type="password" id="login-password" placeholder="••••••••">
      <button class="btn-primary" onclick="doLogin()">लॉगिन</button>

      <div class="auth-switch">खाता नहीं है? <a href="register.html">साइन अप करें</a></div>
      <div class="auth-status" id="auth-status">बैकएंड localhost:5000 पर चलना चाहिए</div>
    </div>
    <div style="text-align:center;"><a href="index.html" class="auth-back">← होम पर वापस जाएं</a></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
